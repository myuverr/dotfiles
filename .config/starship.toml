format = """
$shell\
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$fossil_metrics\
${custom.git_host}\
$all\
$fill\
$cmd_duration\
$time
$character"""

[directory]
truncation_length = 0
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[📦 $repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[line_break]
disabled = true

[time]
disabled = false
style = "grey"

[shell]
disabled = false
fish_indicator = "🐟"
bash_indicator = "🐚"
zsh_indicator = "🚀"
format = "$indicator "

[custom.git_host]
command = """
URL=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$URL" =~ "github" ]]; then
    ICON=""
elif [[ "$URL" =~ "gitlab" ]]; then
    ICON=""
elif [[ "$URL" =~ "azure" || "$URL" =~ "visualstudio" ]]; then
    ICON="󰠅"
elif [[ "$URL" =~ "aws" || "$URL" =~ "codecommit" ]]; then
    ICON="󰸏"
elif [[ "$URL" =~ "bitbucket" ]]; then
    ICON=""
elif [[ "$URL" =~ "kernel" ]]; then
    ICON=""
elif [[ "$URL" =~ "archlinux" ]]; then
    ICON=""
elif [[ "$URL" =~ "gnu" ]]; then
    ICON=""
elif [[ "$URL" =~ "git" ]]; then
    ICON=""
else
    ICON=""
fi
printf "%s" "$ICON"
"""
directories = [".git"]
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash","--norc","--noprofile"]
style = "bright-yellow bold"
format = "at [$output]($style) "
