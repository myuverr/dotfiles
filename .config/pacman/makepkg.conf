#!/hint/bash
# shellcheck disable=2034
#
# ~/.config/pacman/makepkg.conf
# Overrides for /etc/makepkg.conf
#

CFLAGS="-march=native -mtune=native -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection \
        -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
MAKEFLAGS="-j$(nproc)"

# Go has no 'native' option; v4 = requires AVX-512
GOAMD64=""

OPTIONS+=(!debug)

RUSTFLAGS="-C opt-level=3 -C target-cpu=native -C force-frame-pointers=yes"

FFLAGS="-march=native -mtune=native -O2 -pipe -fno-plt \
        -Wp,-D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection \
        -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
FCFLAGS="$FFLAGS"

PACMAN_AUTH=(doas)
