# Fonts
font_size    13.5

# Text cursor customization
cursor_shape                  block
cursor                        none
cursor_blink_interval         0.5 ease-in-out
cursor_stop_blinking_after    15.0
cursor_trail                  3
cursor_trail_decay            0.1 0.4
cursor_trail_start_threshold  2

# Scrollback
momentum_scroll 0.85

# Window layout
remember_window_size         no
enabled_layouts              splits:split_axis=auto,stack
window_padding_width         4 6
single_window_padding_width  8 12
inactive_text_alpha          0.6

# Tab bar
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      slanted
tab_title_template       "{index}: {title}"
active_tab_font_style    bold
inactive_tab_font_style  normal

# Theme
include tokyonight_night.conf

# Keyboard shortcuts

# Window Splitting
map alt+s launch --location=split --cwd=current
map alt+q close_window
map alt+r layout_action rotate

# Window Navigation
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Window Resizing
map alt+shift+h resize_window narrower 3
map alt+shift+j resize_window shorter 3
map alt+shift+k resize_window taller 3
map alt+shift+l resize_window wider 3

# Zoom & Layout Control
map alt+z toggle_layout stack

# Tab Jump
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Include local overrides
include kitty.local.conf
